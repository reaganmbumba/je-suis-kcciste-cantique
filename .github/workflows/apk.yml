name: Construire APK et AAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # « true » seulement quand les secrets de signature ont été ajoutés dans GitHub.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est déjà installé sur les machines ubuntu de GitHub (ANDROID_HOME).

      - name: Tests et APK de test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KCCiste-Cantique-APK-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: AAB non produit (secrets de signature absents)
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::APK de test prêt. Pour obtenir le .aab Google Play, ajoutez les 4 secrets de signature (voir PUBLIER_SUR_GOOGLE_PLAY.md)."

      - name: Préparer la clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: AAB signé pour Google Play
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # +100 : reste au-dessus des numéros déjà envoyés à Google Play depuis l'ancien dépôt.
        run: VERSION_CODE=$((GITHUB_RUN_NUMBER + 100)) ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: KCCiste-Cantique-AAB-Play-Store
          path: app/build/outputs/bundle/release/app-release.aab

      # Lien direct permanent vers le dernier APK de test construit depuis main :
      # https://github.com/<compte>/<dépôt>/releases/download/apk-test/JeSuisKCCisteCantique.apk
      - name: Publier l'APK de test (lien direct)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # APK signé avec la clé Google Play si elle est configurée : les mises à jour
          # s'installent alors par-dessus, sans désinstaller. Sinon, APK de test.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk JeSuisKCCisteCantique.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk JeSuisKCCisteCantique.apk
          fi
          gh release view apk-test >/dev/null 2>&1 || gh release create apk-test --prerelease --title "APK de test" --notes "Dernier APK de test construit depuis main. Non signé pour Google Play."
          gh release upload apk-test JeSuisKCCisteCantique.apk --clobber
