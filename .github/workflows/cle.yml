name: Créer la clé de signature (une seule fois)

# À lancer UNE SEULE FOIS, à la main : onglet Actions › « Créer la clé de signature » › Run workflow.
# Avant : créez les secrets KEYSTORE_PASSWORD (12 caractères ou plus, à retenir), KEY_PASSWORD (le même)
# et KEY_ALIAS (kcciste).
# La clé est livrée dans cle.7z, chiffré avec KEYSTORE_PASSWORD : le dépôt étant public, personne
# d'autre ne peut l'ouvrir. Ouvrez-le avec 7-Zip (https://www.7-zip.org) et ce mot de passe.
on:
  workflow_dispatch:

jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Générer la clé et la chiffrer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ${#KEYSTORE_PASSWORD} -lt 12 ]; then
            echo "::error::Le secret KEYSTORE_PASSWORD est absent ou fait moins de 12 caractères."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Le secret KEY_ALIAS est absent (valeur attendue : kcciste)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cle" sortie
          cd "$RUNNER_TEMP/cle"
          keytool -genkeypair -noprompt \
            -keystore upload.jks -storetype PKCS12 \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Reagan Mbumba, O=KCCiste Cantique, L=Kinshasa, C=CD"
          base64 -w 0 upload.jks > upload.txt
          cat > LISEZ-MOI.txt <<'TXT'
          upload.jks : votre clé de signature Google Play. À GARDER À VIE (ordinateur + clé USB + cloud privé).
          upload.txt : à copier entièrement dans le secret GitHub KEYSTORE_BASE64.
          Ne partagez ces fichiers avec personne.
          TXT
          7z a -bd -p"$KEYSTORE_PASSWORD" -mhe=on "$GITHUB_WORKSPACE/sortie/cle.7z" upload.jks upload.txt LISEZ-MOI.txt > /dev/null
          rm -rf "$RUNNER_TEMP/cle"

      - uses: actions/upload-artifact@v4
        with:
          name: CLE-SIGNATURE-A-GARDER
          path: sortie/cle.7z
          retention-days: 1
