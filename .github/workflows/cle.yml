name: Créer la clé de signature (une seule fois)

# À lancer UNE SEULE FOIS, à la main : onglet Actions › « Créer la clé de signature » › Run workflow.
# Prérequis : dépôt PRIVÉ, et secrets KEYSTORE_PASSWORD et KEY_ALIAS déjà créés.
on:
  workflow_dispatch:

jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le dépôt est privé
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::Le dépôt est PUBLIC : n'importe qui pourrait télécharger votre clé. Rendez-le privé (Settings › Danger Zone › Change visibility), puis relancez."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Générer upload.jks et upload.txt
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ${#KEYSTORE_PASSWORD} -lt 6 ]; then
            echo "::error::Le secret KEYSTORE_PASSWORD est absent ou fait moins de 6 caractères."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Le secret KEY_ALIAS est absent (valeur attendue : kcciste)."
            exit 1
          fi
          mkdir cle
          keytool -genkeypair -noprompt \
            -keystore cle/upload.jks -storetype PKCS12 \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Reagan Mbumba, O=KCCiste Cantique, L=Kinshasa, C=CD"
          base64 -w 0 cle/upload.jks > cle/upload.txt
          cat > cle/LISEZ-MOI.txt <<'TXT'
          upload.jks : votre clé de signature Google Play. À GARDER À VIE (clé USB + cloud privé).
          upload.txt : à copier entièrement dans le secret GitHub KEYSTORE_BASE64.
          Ensuite, supprimez cet artefact dans GitHub (icône corbeille) et ne partagez ces fichiers avec personne.
          TXT
          keytool -list -keystore cle/upload.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: CLE-SIGNATURE-A-GARDER
          path: cle/
          retention-days: 1
